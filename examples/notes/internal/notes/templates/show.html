{{define "content"}}
{{with .Content}}
<article>
<h1>{{.Note.Title}}</h1>
<p>{{.Note.Body}}</p>
</article>
<nav>
<a href="/notes/{{.Note.ID}}/edit">Edit</a>
<form method="post" action="/notes/{{.Note.ID}}/delete" style="display:inline">
<button type="submit">Delete</button>
</form>
</nav>
{{end}}
{{end}}
