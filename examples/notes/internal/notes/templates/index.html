{{define "content"}}
<h1>Notes</h1>
<p><a href="/notes/new">New note</a></p>
<form method="post" action="/export" data-busy data-busy-label="Exporting…">
<button type="submit">Export notes</button>
</form>
{{with .Content}}
{{if .Notes}}
<ul>
{{range .Notes}}
<li><a href="/notes/{{.ID}}">{{.Title}}</a></li>
{{end}}
</ul>
{{else}}
<p>No notes yet.</p>
{{end}}
{{end}}
{{end}}
