# gitleaks' default rules, and one for this app's API tokens, which the
# defaults do not know. A token found here stays in every clone of the
# history: revoke it on the app's token page.
[extend]
useDefault = true

[[rules]]
id = "rastrillo-api-token"
description = "Rastrillo API token"
regex = '''\b[a-z][a-z0-9]{0,15}_[0-9A-Za-z]{12}_[0-9A-Za-z]{43}\b'''
