# CI pins the claims the READMEs make: the root sweep, both examples'
# full ./... sweeps (the F9 fix — actions/ is generator input the go
# tool must skip), generate --check as the ship gate, committed gen/
# output matching what the generator writes today, and a fresh scaffold
# that builds. All of this was manually verified before CI existed;
# this workflow is those exact commands, pinned.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The READMEs' documented sweep commands all run with GOFLAGS=-mod=mod;
    # the tests that build scratch modules (replace => this repo) rely on it
    # to resolve module data the scratch go.sum doesn't carry. Without it,
    # -mod=readonly fails every nested go build on a fresh runner.
    env:
      GOFLAGS: -mod=mod
      # The spec's acceptance criterion is CGO_ENABLED=0 across the
      # tree (static binaries; gormlite must never pull in a cgo
      # driver) — pinned job-wide so a runner image with a C toolchain
      # can't quietly satisfy a build that would fail without one.
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: root module
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # The race detector needs cgo, so this one step overrides the
      # job-wide CGO_ENABLED=0 — the static-binary criterion is about
      # what ships, not about what a detector build links. Scoped to the
      # two packages whose tests are actually concurrent: jobs (Start
      # spawns a goroutine per job, Get reads the same map) and sessions.
      - name: race detector
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./jobs/ ./sessions/

      - name: examples/helloworld ./... sweep
        working-directory: examples/helloworld
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: examples/blog ./... sweep
        working-directory: examples/blog
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # blog and tickets carry a `go tool sqlc` directive; their sweeps
      # and the generate steps below fetch sqlc via the module proxy on
      # first run. That network access is load-bearing - don't cache it
      # away without keeping the module download path working.
      - name: examples/tickets ./... sweep
        working-directory: examples/tickets
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # notes is the mixed example: the hand-written middle-layer half
      # plus one declared, user-scoped manifest resource (bookmarks) —
      # so it carries the sqlc tool directive too, and joins the
      # generate --check step below. CGO_ENABLED=0 comes from the job
      # env now.
      - name: examples/notes ./... sweep
        working-directory: examples/notes
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: generate --check and gen/ drift
        run: |
          go build -o /tmp/rastrillo ./cmd/rastrillo
          /tmp/rastrillo generate --check examples/helloworld
          /tmp/rastrillo generate --check examples/blog
          /tmp/rastrillo generate --check examples/tickets
          /tmp/rastrillo generate --check examples/notes
          /tmp/rastrillo generate examples/helloworld
          /tmp/rastrillo generate examples/blog
          /tmp/rastrillo generate examples/tickets
          /tmp/rastrillo generate examples/notes
          # Committed gen/ must match what today's generator writes.
          git diff --exit-code

      - name: scaffold smoke
        run: |
          appdir=$(mktemp -d)
          cd "$appdir"
          /tmp/rastrillo new smokeapp
          cd smokeapp
          go mod edit -replace github.com/carlosframework/rastrillo="$GITHUB_WORKSPACE"
          go mod tidy
          go build ./...
          go vet ./...
          go build -o smokeapp ./cmd/smokeapp
          ./smokeapp -addr 127.0.0.1:8199 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8199/healthz && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8199/healthz
          kill %1
