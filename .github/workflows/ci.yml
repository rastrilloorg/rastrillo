# CI pins the claims the READMEs make: the root sweep, both examples'
# full ./... sweeps (the F9 fix — actions/ is generator input the go
# tool must skip), generate --check as the ship gate, committed gen/
# output matching what the generator writes today, and a fresh scaffold
# that builds. All of this was manually verified before CI existed;
# this workflow is those exact commands, pinned.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # No GOFLAGS=-mod=mod, deliberately. It used to be set here because
    # the tests that build scratch modules (replace => this repo) had no
    # module data for rastrillo's own dependencies, so every nested go
    # build inside one failed under -mod=readonly. internal/scratchmod
    # now gives those modules the checkout's requirements and go.sum, so
    # they resolve offline without it.
    #
    # Getting rid of it matters beyond tidiness: under -mod=mod a missing
    # go.sum entry is not an error — the toolchain writes the requirement
    # and carries on — so this job cheerfully watched a scaffolded app's
    # `make ci` pass for four releases while it failed for every user
    # (CHANGELOG v0.24.0). The default -mod=readonly is what users run,
    # and it is what CI must run to see what they see.
    env:
      # The spec's acceptance criterion is CGO_ENABLED=0 across the
      # tree (static binaries; gormlite must never pull in a cgo
      # driver) — pinned job-wide so a runner image with a C toolchain
      # can't quietly satisfy a build that would fail without one.
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: root module
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # The README promises that chromedp stays out of the ordinary
      # build graph. This is that sentence, executable.
      - name: chromedp stays out of the ordinary build graph
        run: |
          if go list -deps ./... | grep -i chromedp; then
            echo "go list -deps ./... pulls chromedp — the README's promise is broken"
            exit 1
          fi

      # The race detector needs cgo, so this one step overrides the
      # job-wide CGO_ENABLED=0 — the static-binary criterion is about
      # what ships, not about what a detector build links. Scoped to the
      # two packages whose tests are actually concurrent: jobs (Start
      # spawns a goroutine per job, Get reads the same map) and sessions.
      - name: race detector
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./jobs/ ./sessions/

      - name: examples/helloworld ./... sweep
        working-directory: examples/helloworld
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: examples/blog ./... sweep
        working-directory: examples/blog
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # blog and tickets carry a `go tool sqlc` directive; their sweeps
      # and the generate steps below fetch sqlc via the module proxy on
      # first run. That network access is load-bearing - don't cache it
      # away without keeping the module download path working.
      - name: examples/tickets ./... sweep
        working-directory: examples/tickets
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      # notes is the mixed example: the hand-written middle-layer half
      # plus one declared, user-scoped manifest resource (bookmarks) —
      # so it carries the sqlc tool directive too, and joins the
      # generate --check step below. CGO_ENABLED=0 comes from the job
      # env now.
      - name: examples/notes ./... sweep
        working-directory: examples/notes
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: generate --check and gen/ drift
        run: |
          go build -o /tmp/rastrillo ./cmd/rastrillo
          /tmp/rastrillo generate --check examples/helloworld
          /tmp/rastrillo generate --check examples/blog
          /tmp/rastrillo generate --check examples/tickets
          /tmp/rastrillo generate --check examples/notes
          /tmp/rastrillo generate examples/helloworld
          /tmp/rastrillo generate examples/blog
          /tmp/rastrillo generate examples/tickets
          /tmp/rastrillo generate examples/notes
          # Committed gen/ must match what today's generator writes.
          git diff --exit-code

      - name: scaffold smoke
        run: |
          appdir=$(mktemp -d)
          cd "$appdir"
          /tmp/rastrillo new smokeapp
          cd smokeapp
          go mod edit -replace github.com/carlosframework/rastrillo="$GITHUB_WORKSPACE"
          go mod tidy
          # The scaffolded app's OWN gate, not a hand-rolled substitute
          # for it. This step used to run build+vet, which is a subset
          # of `make ci` that happens to exclude the migration-check
          # step — so a scaffold whose go.mod could not resolve the CLI
          # passed here and failed on the first `make ci` of every real
          # user (CHANGELOG v0.24.0). If the scaffold ships a gate, the
          # smoke test is that gate.
          make ci
          go build -o smokeapp ./cmd/smokeapp
          ./smokeapp -addr 127.0.0.1:8199 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8199/healthz && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8199/healthz
          kill %1

  # The browser drive: rastrillo's own browser-tagged tests — the ui
  # select journey, the harness's own checks, and webauthn's PRF
  # ceremonies including the prfByAssertion fallback — on every PR.
  # RASTRILLO_BROWSER_OPTIONAL stays unset on purpose: a skip is not a
  # pass, so a runner that loses its browser fails loudly.
  browser:
    runs-on: ubuntu-latest
    # No GOFLAGS here either — see the test job's note.
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A pinned Playwright pins the Chromium build it installs. The
      # runner's preinstalled Chrome floats with the image and apt's
      # chromium is a snap shim, so RASTRILLO_CHROME points the tests
      # at the binary this step just installed — explicitly, because
      # PATH discovery would find the floating Chrome first and the
      # cache layout varies across Playwright versions. 1.62.1 pins
      # chromium-1234 — the build the whole suite is green against;
      # 1.54.1's chromium-1181 deterministically dropped the enhanced
      # select's Enter commit. Bump the pin deliberately, and rerun the
      # tagged suite against the new build when you do.
      - name: install pinned chromium
        run: |
          npx --yes playwright@1.62.1 install --with-deps chromium
          echo "RASTRILLO_CHROME=$(ls "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | tail -1)" >> "$GITHUB_ENV"

      # Only the packages carrying browser-tagged tests: the plain
      # suite already ran in the test job, and -tags browser ./...
      # would rerun all of it here for nothing. -p 1 serialises the
      # packages — parallel Chromium cold-starts contend for the
      # runner, and the contention is real: the ui select drive has
      # been seen to blow its 180s deadline when two Chromium-heavy
      # packages start together.
      #
      # ./internal/designsystem/ carries the accessibility gate
      # (a11y_test.go: axe-core over the committed gallery, the 320px
      # reflow check and the keyboard walk) alongside the gallery's own
      # drives. docs/site/templates.md tells readers the gallery is
      # scanned to WCAG 2.2 AA on every CI run; this line is the whole
      # of what makes that sentence true, so removing it means editing
      # that paragraph in the same commit.
      #
      # ./ui/ runs whole. It used to be excluded, and the exclusion
      # used to be right: the script-driven drives were 0-for-5 here
      # while deterministic-green locally, because the Enter that
      # commits the enhanced select's choice was also submitting the
      # form and taking the page out from under the drive. That was
      # never a runner fault and never a flake — issue #86 traced it to
      # a real gap in select.js. A synthesised key press arrives as two
      # independent events, and the second one carried the \r of
      # implicit form submission with the first one's preventDefault
      # already forgotten, so the drive fired a submit on EVERY run
      # everywhere and passed only where reading the mirror outran the
      # navigation. select.js now refuses the keypress as well as the
      # keydown, the way datetime.js always did, and
      # TestEnterCommitsWithoutSubmittingTheForm holds both widgets to
      # it. Nothing is filtered out of ./ui/ any more; if a drive here
      # goes red, read it as a regression.
      - name: browser-tagged tests
        run: go test -tags browser -p 1 ./harness/ ./webauthn/ ./ui/ ./internal/designsystem/ -count=1
