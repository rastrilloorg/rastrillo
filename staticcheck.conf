# staticcheck's default set, minus ST1018.
#
# ST1018 asks for Unicode format characters in string literals to be
# written as escapes. The design system's right-to-left translations
# carry U+200E and U+200F marks on purpose - they decide where a Latin
# brand name sits inside Arabic or Hebrew prose - and as ‏ escapes
# those strings stop being readable or editable by the translator who
# owns them. "inherit" keeps every other default, including the ones a
# future staticcheck release adds.
checks = ["inherit", "-ST1018"]
